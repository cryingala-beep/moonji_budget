<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무추진비 관리 — 문학과지성사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --border: #e8e4dc;
    --text: #1a1a1a;
    --text-sub: #6b6760;
    --text-hint: #b0aca4;
    --accent: #2c2c2c;
    --green: #2d6a4f;
    --green-bg: #eaf4ee;
    --amber: #92590a;
    --amber-bg: #fef3e2;
    --red: #991b1b;
    --red-bg: #fef2f2;
    --gray-bg: #f1ede6;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; min-height: 100vh; }
  header { background: var(--accent); color: #fff; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 16px; font-weight: 500; letter-spacing: 0.03em; }
  header span { font-size: 12px; opacity: 0.5; }
  .container { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
  .summary-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 24px; }
  @media (max-width: 600px) { .summary-grid { grid-template-columns: repeat(2,1fr); } }
  .scard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .scard-label { font-size: 11px; color: var(--text-hint); margin-bottom: 6px; letter-spacing: 0.04em; }
  .scard-value { font-size: 22px; font-weight: 700; color: var(--text); }
  .scard-value.danger { color: var(--red); }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 16px; }
  .panel-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 16px; letter-spacing: 0.04em; display: flex; align-items: center; gap: 8px; }
  .panel-title::before { content: ''; display: inline-block; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }
  .input-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11px; color: var(--text-sub); letter-spacing: 0.03em; }
  select, input[type=number], input[type=text], input[type=date] { height: 38px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); padding: 0 12px; font-size: 14px; font-family: inherit; outline: none; transition: border-color .15s; }
  select:focus, input:focus { border-color: var(--accent); background: var(--surface); }
  select { min-width: 130px; }
  #amountInput { width: 150px; }
  #memoInput { width: 170px; }
  input[type=date] { width: 155px; }
  .dow-badge { height: 38px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--gray-bg); color: var(--text-sub); font-size: 13px; font-weight: 500; display: flex; align-items: center; min-width: 52px; justify-content: center; }
  button { height: 38px; padding: 0 18px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; transition: all .15s; white-space: nowrap; }
  button:hover { background: var(--bg); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
  button.primary:hover { opacity: .85; }
  button.sm { height: 32px; padding: 0 12px; font-size: 12px; }
  button.danger-btn { color: var(--red); border-color: var(--border); }
  button.danger-btn:hover { background: var(--red-bg); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .chip-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .chip-header-label { font-size: 12px; color: var(--text-sub); }
  .chip-header-label strong { color: var(--text); }
  .chip-search input { width: 100%; height: 34px; font-size: 13px; margin-bottom: 8px; }
  .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px,1fr)); gap: 6px; max-height: 210px; overflow-y: auto; padding: 2px; }
  .member-chip { padding: 6px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 13px; cursor: pointer; text-align: center; transition: all .15s; color: var(--text-sub); background: var(--surface); user-select: none; }
  .member-chip:hover { border-color: var(--accent); color: var(--text); }
  .member-chip.selected { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
  .selected-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-sub); }
  .sel-tag { background: var(--gray-bg); color: var(--text); padding: 3px 8px; border-radius: var(--radius-sm); font-size: 12px; display: flex; align-items: center; gap: 4px; }
  .sel-tag button { height: auto; padding: 0; border: none; background: none; font-size: 14px; color: var(--text-hint); cursor: pointer; line-height: 1; }
  .sel-tag button:hover { background: none; color: var(--red); }
  .apply-row { display: flex; align-items: center; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
  .preview-text { font-size: 12px; color: var(--text-sub); }
  .alert { margin-top: 12px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; }
  .alert.success { background: var(--green-bg); color: var(--green); }
  .alert.warn { background: var(--amber-bg); color: var(--amber); }
  .controls-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .controls-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #searchInput { width: 130px; height: 32px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; font-weight: 500; color: var(--text-hint); letter-spacing: 0.05em; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); color: var(--text); font-size: 13px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .bar-wrap { width: 88px; height: 5px; background: var(--border); border-radius: 3px; display: inline-block; vertical-align: middle; }
  .bar-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width .4s ease; }
  .bar-fill.mid { background: var(--amber); }
  .bar-fill.low { background: var(--red); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; display: inline-block; font-weight: 500; }
  .badge.ok { background: var(--green-bg); color: var(--green); }
  .badge.warn { background: var(--amber-bg); color: var(--amber); }
  .badge.danger { background: var(--red-bg); color: var(--red); }
  .badge.zero { background: var(--gray-bg); color: var(--text-hint); }
  .edit-input { width: 100px !important; height: 28px !important; font-size: 12px !important; min-width: unset !important; padding: 0 8px !important; }
  .empty { text-align: center; padding: 28px; color: var(--text-hint); font-size: 13px; }
  .del-btn { height: 26px; padding: 0 10px; font-size: 11px; color: var(--text-hint); border-color: var(--border); border-radius: var(--radius-sm); }
  .del-btn:hover { background: var(--red-bg); color: var(--red); border-color: var(--red); }
  .loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; z-index: 999; }
  .loading-box { background: var(--surface); border-radius: var(--radius); padding: 24px 32px; font-size: 14px; color: var(--text-sub); display: flex; align-items: center; gap: 12px; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sync-bar { font-size: 11px; color: var(--text-hint); margin-top: 12px; text-align: right; }
  .sync-bar span { color: var(--green); }
</style>
</head>
<body>

<header>
  <h1>업무추진비 관리</h1>
  <span>문학과지성사</span>
</header>

<div class="container">
  <div class="summary-grid" id="summaryCards"></div>

  <div class="panel">
    <div class="panel-title">결제 입력</div>
    <div class="input-row">
      <div class="field">
        <label>결제자</label>
        <select id="payerSelect"></select>
      </div>
      <div class="field">
        <label>결제 금액 (원)</label>
        <input type="number" id="amountInput" placeholder="예: 60000" min="0" step="1000" oninput="updatePreview()" />
      </div>
      <div class="field">
        <label>날짜</label>
        <div style="display:flex;gap:6px;align-items:center;">
          <input type="date" id="dateInput" />
          <div class="dow-badge" id="dowBadge">—</div>
        </div>
      </div>
      <div class="field">
        <label>메모 (선택)</label>
        <input type="text" id="memoInput" placeholder="예: 팀 회식" />
      </div>
    </div>
    <div class="chip-header">
      <span class="chip-header-label">같이 먹은 사람 선택 <strong id="selCount"></strong></span>
      <div style="display:flex;gap:6px;">
        <button class="sm" onclick="selectAll()">전체 선택</button>
        <button class="sm" onclick="clearAll()">전체 해제</button>
      </div>
    </div>
    <div class="chip-search"><input type="text" id="chipSearch" placeholder="이름으로 필터..." oninput="renderChips()" /></div>
    <div class="member-grid" id="memberGrid"></div>
    <div class="selected-bar" id="selectedBar"></div>
    <div class="apply-row">
      <button class="primary" id="applyBtn" onclick="applyPayment()">차감 적용</button>
      <span class="preview-text" id="previewText"></span>
    </div>
    <div id="alertBox"></div>
  </div>

  <div class="panel">
    <div class="controls-row">
      <div class="panel-title" style="margin-bottom:0;">잔액 현황</div>
      <div class="controls-right">
        <input type="text" id="searchInput" placeholder="이름 검색..." oninput="renderBalance()" />
        <button class="sm" onclick="toggleSort()" id="sortBtn">잔액순 정렬</button>
        <button class="sm" onclick="loadData()">🔄 새로고침</button>
        <button class="sm danger-btn" onclick="resetAll()">전체 초기화</button>
      </div>
    </div>
    <table>
      <thead><tr><th>이름</th><th>잔액</th><th>사용률</th><th>상태</th><th>직접 수정</th></tr></thead>
      <tbody id="balanceBody"></tbody>
    </table>
  </div>

  <div class="panel">
    <div class="panel-title">결제 이력</div>
    <div id="historyWrap"></div>
  </div>

  <p class="sync-bar" id="syncBar">데이터를 불러오는 중...</p>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyS2dzSxSv7bgwbD8l1YTUh96CDz3gFWTQQWqIKtg2Hg0T3ReRb-m-rJPLIBZ19AAEf1w/exec';
const INITIAL = 200000;
const DOWS = ['일','월','화','수','목','금','토'];

let members = [];
let history = [];
let selected = new Set();
let sortByBalance = false;

function fmt(n) { return Math.round(n).toLocaleString('ko-KR') + '원'; }

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dowFromDate(str) {
  if (!str) return '—';
  return DOWS[new Date(str + 'T00:00:00').getDay()] + '요일';
}
function formatDateDisplay(str) {
  if (!str) return '';
  const d = new Date(str + 'T00:00:00');
  return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} (${DOWS[d.getDay()]})`;
}

document.getElementById('dateInput').value = todayStr();
document.getElementById('dowBadge').textContent = dowFromDate(todayStr());
document.getElementById('dateInput').addEventListener('change', function() {
  document.getElementById('dowBadge').textContent = this.value ? dowFromDate(this.value) : '—';
});

function showLoading(msg) {
  let el = document.getElementById('loadingOverlay');
  if (!el) {
    el = document.createElement('div');
    el.id = 'loadingOverlay';
    el.className = 'loading-overlay';
    document.body.appendChild(el);
  }
  el.innerHTML = `<div class="loading-box"><div class="spinner"></div>${msg||'처리 중...'}</div>`;
  el.style.display = 'flex';
}
function hideLoading() {
  const el = document.getElementById('loadingOverlay');
  if (el) el.style.display = 'none';
}

async function loadData() {
  showLoading('데이터 불러오는 중...');
  try {
    const res = await fetch(API);
    const data = await res.json();
    members = data.members;
    history = data.history;
    renderAll();
    const now = new Date();
    document.getElementById('syncBar').innerHTML = `<span>동기화 완료</span> · ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  } catch(e) {
    document.getElementById('syncBar').textContent = '데이터 불러오기 실패. 새로고침 버튼을 눌러주세요.';
  }
  hideLoading();
}

async function postData(payload, loadingMsg) {
  showLoading(loadingMsg || '처리 중...');
  try {
    const res = await fetch(API, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.ok) {
      members = data.members;
      history = data.history;
      renderAll();
      const now = new Date();
      document.getElementById('syncBar').innerHTML = `<span>저장 완료</span> · ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
    }
    return data;
  } catch(e) {
    alert('오류가 발생했어요. 다시 시도해주세요.');
  } finally {
    hideLoading();
  }
}

function renderAll() {
  renderSummary(); renderPayer(); renderChips(); renderBalance(); renderHistory();
}

function renderSummary() {
  const total = members.reduce((a, m) => a + m.balance, 0);
  const used = members.length * INITIAL - total;
  const avg = members.length ? total / members.length : 0;
  const low = members.filter(m => m.balance < 30000).length;
  document.getElementById('summaryCards').innerHTML = `
    <div class="scard"><div class="scard-label">총 잔여 예산</div><div class="scard-value">${fmt(total)}</div></div>
    <div class="scard"><div class="scard-label">총 사용액</div><div class="scard-value">${fmt(used)}</div></div>
    <div class="scard"><div class="scard-label">1인 평균 잔액</div><div class="scard-value">${fmt(avg)}</div></div>
    <div class="scard"><div class="scard-label">잔액 3만원 미만</div><div class="scard-value ${low>0?'danger':''}">${low}명</div></div>
  `;
}

function renderChips() {
  const q = document.getElementById('chipSearch').value.trim();
  const filtered = members.filter(m => !q || m.name.includes(q));
  document.getElementById('memberGrid').innerHTML = filtered.map((m, fi) => {
    const i = members.indexOf(m);
    return `<div class="member-chip ${selected.has(i)?'selected':''}" onclick="toggleMember(${i})">${m.name}</div>`;
  }).join('');
  updateSelCount(); renderSelectedBar(); updatePreview();
}

function toggleMember(i) {
  if (selected.has(i)) selected.delete(i); else selected.add(i);
  renderChips();
}
function selectAll() { members.forEach((_,i) => selected.add(i)); renderChips(); }
function clearAll() { selected.clear(); renderChips(); }

function updateSelCount() {
  document.getElementById('selCount').textContent = selected.size > 0 ? `(${selected.size}명 선택됨)` : '';
}
function renderSelectedBar() {
  const bar = document.getElementById('selectedBar');
  if (!selected.size) { bar.innerHTML = ''; return; }
  bar.innerHTML = `<span>선택:</span>` + [...selected].map(i =>
    `<span class="sel-tag">${members[i].name}<button onclick="toggleMember(${i})" title="제거">×</button></span>`
  ).join('');
}
function updatePreview() {
  const amount = parseFloat(document.getElementById('amountInput').value);
  document.getElementById('previewText').textContent =
    (!isNaN(amount) && amount > 0 && selected.size > 0) ? `→ 1인 차감액: ${fmt(amount / selected.size)}` : '';
}

function renderPayer() {
  document.getElementById('payerSelect').innerHTML =
    members.map((m,i) => `<option value="${i}">${m.name}</option>`).join('');
}

function renderBalance() {
  const q = document.getElementById('searchInput').value.trim();
  let list = members.map((m,i) => ({...m, idx:i}));
  if (q) list = list.filter(m => m.name.includes(q));
  if (sortByBalance) list.sort((a,b) => a.balance - b.balance);
  const tbody = document.getElementById('balanceBody');
  if (!list.length) { tbody.innerHTML = `<tr><td colspan="5" class="empty">검색 결과 없음</td></tr>`; return; }
  tbody.innerHTML = list.map(m => {
    const pct = Math.max(0, Math.round(m.balance / INITIAL * 100));
    const bc = pct < 20 ? 'low' : pct < 50 ? 'mid' : '';
    const badge = m.balance <= 0
      ? `<span class="badge zero">소진</span>`
      : m.balance < 30000 ? `<span class="badge danger">잔액 부족</span>`
      : m.balance < 100000 ? `<span class="badge warn">50% 미만</span>`
      : `<span class="badge ok">정상</span>`;
    return `<tr>
      <td>${m.name}</td>
      <td><strong>${fmt(m.balance)}</strong></td>
      <td><span class="bar-wrap"><span class="bar-fill ${bc}" style="width:${pct}%"></span></span><span style="font-size:11px;color:var(--text-hint);margin-left:6px;">${pct}%</span></td>
      <td>${badge}</td>
      <td><input class="edit-input" type="number" value="${m.balance}" onchange="editBalance('${m.name}', this.value)" /></td>
    </tr>`;
  }).join('');
}

async function editBalance(name, val) {
  const v = parseInt(val);
  if (isNaN(v) || v < 0) return;
  await postData({ action: 'editBalance', name, balance: v }, '잔액 수정 중...');
}

function renderHistory() {
  const wrap = document.getElementById('historyWrap');
  if (!history.length) { wrap.innerHTML = `<div class="empty">아직 결제 이력이 없어요</div>`; return; }
  wrap.innerHTML = `<table>
    <thead><tr><th>#</th><th>날짜</th><th>결제자</th><th>결제 금액</th><th>1인 차감액</th><th>참석자</th><th>메모</th><th></th></tr></thead>
    <tbody>${[...history].reverse().map((h, i) => {
      const realIdx = history.length - 1 - i;
      return `<tr>
        <td style="color:var(--text-hint);">${history.length - i}</td>
        <td style="white-space:nowrap;">${h.date}</td>
        <td>${h.payer}</td>
        <td><strong>${fmt(h.amount)}</strong></td>
        <td>${fmt(h.perPerson)}</td>
        <td style="color:var(--text-sub);font-size:12px;">${h.attendees.join(', ')}</td>
        <td style="color:var(--text-sub);">${h.memo||'—'}</td>
        <td><button class="del-btn" onclick="deleteHistory(${realIdx})">삭제</button></td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

async function deleteHistory(idx) {
  const h = history[idx];
  if (!confirm(`이 이력을 삭제하고 잔액을 복구할까요?\n\n${h.date} · ${h.attendees.join(', ')} · ${fmt(h.amount)}`)) return;
  await postData({ action: 'deleteHistory', idx }, '이력 삭제 중...');
}

async function applyPayment() {
  const idx = parseInt(document.getElementById('payerSelect').value);
  const amount = parseFloat(document.getElementById('amountInput').value);
  const memo = document.getElementById('memoInput').value.trim();
  const dateVal = document.getElementById('dateInput').value;
  const alertBox = document.getElementById('alertBox');
  alertBox.innerHTML = '';

  if (isNaN(amount) || amount <= 0) { alertBox.innerHTML = `<div class="alert warn">결제 금액을 입력해주세요.</div>`; return; }
  if (!dateVal) { alertBox.innerHTML = `<div class="alert warn">날짜를 선택해주세요.</div>`; return; }
  if (selected.size === 0) { alertBox.innerHTML = `<div class="alert warn">같이 먹은 사람을 한 명 이상 선택해주세요.</div>`; return; }

  const perPerson = amount / selected.size;
  const attendees = [...selected].map(i => members[i].name);

  const result = await postData({
    action: 'applyPayment',
    payer: members[idx].name,
    amount, perPerson, attendees, memo,
    date: formatDateDisplay(dateVal)
  }, '저장 중...');

  if (result?.ok) {
    document.getElementById('amountInput').value = '';
    document.getElementById('memoInput').value = '';
    document.getElementById('dateInput').value = todayStr();
    document.getElementById('dowBadge').textContent = dowFromDate(todayStr());
    selected.clear();
    updatePreview();
    alertBox.innerHTML = `<div class="alert success">${formatDateDisplay(dateVal)} · ${attendees.join(', ')} — ${fmt(amount)} 결제, 1인 ${fmt(perPerson)} 차감 완료</div>`;
    setTimeout(() => { alertBox.innerHTML = ''; }, 4000);
  }
}

function toggleSort() {
  sortByBalance = !sortByBalance;
  document.getElementById('sortBtn').textContent = sortByBalance ? '이름순 정렬' : '잔액순 정렬';
  renderBalance();
}

async function resetAll() {
  if (!confirm('모든 잔액을 20만원으로 초기화하고 이력을 전부 삭제할까요?')) return;
  selected.clear();
  await postData({ action: 'resetAll' }, '초기화 중...');
}

loadData();
</script>
